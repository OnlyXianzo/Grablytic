# Nightly build — full matrix on schedule, rolling `nightly` GitHub release.
#
# Standard artifact naming system (single source of truth for this repo):
#   Android:  grablytic-v<ver>-nightly-<YYYYMMDD>-<sha>-<variant>.apk
#             e.g. grablytic-v0.0.2-nightly-20260916-abc1234-arm64-deno.apk
#   Linux:    grablytic-<ver>-nightly-<YYYYMMDD>-<sha>-linux-<arch>.tar.gz
#             grablytic-<ver>-nightly-<YYYYMMDD>-<sha>-1-<arch>.pkg.tar.zst
#             (.deb/.rpm keep native conventions + nightly suffix where placed)
#   Windows:  grablytic-windows-x64-nightly-<YYYYMMDD>-<sha>.zip
# Release builds use the identical scheme with an empty suffix, so release
# asset names are unchanged (Obtainium-safe).
#
# Pipeline: verify (reused) must pass before any build starts — a red tree
# produces no nightly and uploads nothing. The rolling `nightly` tag is
# refreshed in place (old dated assets deleted first); it is a prerelease.
# Keystore signing flows through automatically when KEYSTORE_BASE64 is set.

name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  prep:
    name: Compute Nightly Suffix
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.stamp.outputs.suffix }}
      datestamp: ${{ steps.stamp.outputs.datestamp }}
      sha: ${{ steps.stamp.outputs.sha }}
      has_ftl: ${{ steps.gate.outputs.has_ftl }}
    steps:
      - uses: actions/checkout@v4

      - id: stamp
        run: |
          DATESTAMP=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "suffix=-nightly-$DATESTAMP-$SHA" >> $GITHUB_OUTPUT
          echo "Nightly suffix: -nightly-$DATESTAMP-$SHA"

      # secrets context is illegal in jobs.<id>.if — expose as an output.
      - id: gate
        run: |
          echo "has_ftl=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}" >> $GITHUB_OUTPUT

  verify:
    name: Verify (gate)
    needs: [prep]
    uses: ./.github/workflows/verify.yml

  build:
    name: Build Matrix
    needs: [prep, verify]
    uses: ./.github/workflows/build.yml
    with:
      asset_suffix: ${{ needs.prep.outputs.suffix }}
      publish_to_release: false
    secrets: inherit

  # Option 1 (free, no hardware): boot an emulator with KVM, install the
  # x86_64 nightly APK, force Doze, and capture power diagnostics. Proves
  # install/boot/Doze-survival + records wake-lock holder state for T2-1.
  doze-emulator:
    name: Emulator Doze + Install Smoke (API 34)
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download x86_64 nightly APK
        uses: actions/download-artifact@v4
        with:
          pattern: grablytic-x86_64-deno-*
          path: apk
          merge-multiple: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install, force Doze, capture diagnostics
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            APK=$(ls apk/*.apk | head -n 1)
            echo "Installing $APK"
            adb install -r "$APK"
            adb shell monkey -p com.theonly.grablytic -c android.intent.category.LAUNCHER 1
            sleep 20
            echo "--- forcing Doze ---"
            adb shell dumpsys battery unplug
            adb shell dumpsys deviceidle force-idle
            adb shell dumpsys deviceidle get deep || true
            sleep 30
            mkdir -p doze-out
            adb shell dumpsys batterystats > doze-out/batterystats.txt || true
            grep -i "grablytic\|PARTIAL_WAKE_LOCK\|WifiLock" doze-out/batterystats.txt | head -n 20 || true
            adb shell dumpsys activity services com.theonly.grablytic > doze-out/services.txt || true
            adb logcat -d > doze-out/logcat.txt || true
            echo "--- fatal crash scan ---"
            if grep -i "FATAL EXCEPTION.*grablytic\|AndroidRuntime.*grablytic" doze-out/logcat.txt | head -n 5; then
              echo "FATAL crashes found — failing the job"
              exit 1
            fi
            echo "no fatal crashes; diagnostics captured"

      - name: Upload Doze diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doze-diagnostics${{ needs.prep.outputs.suffix }}
          path: doze-out/

  # Option 2 (free Spark tier: 15 runs/day incl. 5 physical): Robo crawl on
  # a real device — install/launch smoke with no pre-written tests.
  # SETUP (one-time, human): create a Firebase project, add a service
  # account with Firebase Test Lab Admin, store its JSON key as the
  # FIREBASE_SERVICE_ACCOUNT repo secret. Job skips cleanly until then.
  ftl-robo:
    name: Firebase Test Lab Robo (physical)
    needs: [prep, build]
    if: ${{ needs.prep.outputs.has_ftl == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download arm64 nightly APK
        uses: actions/download-artifact@v4
        with:
          pattern: grablytic-arm64-deno-*
          path: ftl-apk
          merge-multiple: true

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Robo crawl on physical device
        run: |
          APK=$(ls ftl-apk/*.apk | head -n 1)
          gcloud firebase test android run \
            --type robo \
            --app "$APK" \
            --device model=panther,version=33 \
            --timeout 5m

  publish-nightly:
    name: Publish Rolling Nightly Release
    needs: [prep, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all nightly artifacts
        uses: actions/download-artifact@v4
        with:
          path: nightly-artifacts

      - name: Stage nightly assets
        run: |
          mkdir -p nightly_assets
          find nightly-artifacts -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.tar.gz" -o -name "*.zip" \) | while read -r file; do
            fname=$(basename "$file")
            echo "Staging: $fname"
            cp "$file" "nightly_assets/$fname"
          done
          echo "=== Nightly Assets (${{ needs.prep.outputs.suffix }}) ==="
          ls -lh nightly_assets/

      - name: Refresh rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUFFIX: ${{ needs.prep.outputs.suffix }}
          DATESTAMP: ${{ needs.prep.outputs.datestamp }}
          SHA: ${{ needs.prep.outputs.sha }}
        run: |
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly nightly_assets/* \
              --title "Grablytic Nightly $DATESTAMP ($SHA)" \
              --notes "Rolling nightly build from main @ $SHA. Pre-release: expect rough edges." \
              --prerelease
          else
            # Dated names accumulate — clear last night's assets first.
            for asset in $(gh release view nightly --json assets -q '.assets[].name'); do
              gh release delete-asset nightly "$asset" --yes
            done
            gh release upload nightly nightly_assets/* --clobber
            gh release edit nightly \
              --title "Grablytic Nightly $DATESTAMP ($SHA)" \
              --notes "Rolling nightly build from main @ $SHA. Pre-release: expect rough edges." \
              --prerelease
          fi
