# Nightly build — full matrix on schedule, rolling `nightly` GitHub release.
#
# Standard artifact naming system (single source of truth for this repo):
#   Android:  grablytic-v<ver>-nightly-<YYYYMMDD>-<sha>-<variant>.apk
#             e.g. grablytic-v0.0.2-nightly-20260916-abc1234-arm64-deno.apk
#   Linux:    grablytic-<ver>-nightly-<YYYYMMDD>-<sha>-linux-<arch>.tar.gz
#             grablytic-<ver>-nightly-<YYYYMMDD>-<sha>-1-<arch>.pkg.tar.zst
#             (.deb/.rpm keep native conventions + nightly suffix where placed)
#   Windows:  grablytic-windows-x64-nightly-<YYYYMMDD>-<sha>.zip
# Release builds use the identical scheme with an empty suffix, so release
# asset names are unchanged (Obtainium-safe).
#
# Pipeline: verify (reused) must pass before any build starts — a red tree
# produces no nightly and uploads nothing. The rolling `nightly` tag is
# refreshed in place (old dated assets deleted first); it is a prerelease.
# Keystore signing flows through automatically when KEYSTORE_BASE64 is set.
#
# Auto-run gate: scheduled runs only proceed when ≥10 new commits exist
# since the `nightly` tag (MIN_COMMITS). Manual `workflow_dispatch` runs
# always proceed (bypass the gate).

name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  MIN_COMMITS: '10'

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    name: Gate — 10 new commits since nightly?
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      commit_count: ${{ steps.check.outputs.commit_count }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          THRESHOLD="${MIN_COMMITS:-10}"
          echo "Threshold: $THRESHOLD commits"

          # Manual runs always proceed — the gate only throttles the schedule.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — bypassing commit gate."
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "commit_count=manual" >> $GITHUB_OUTPUT
            echo "base=manual" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Base = the commit the last successful nightly actually built,
          # recovered from the rolling `nightly` release's asset names,
          # which embed it as …-nightly-<YYYYMMDD>-<sha>-….
          #
          # The `nightly` git TAG must NOT be used as the base: it is a
          # rolling release tag that is created once and never moved (the
          # publish job only swaps assets + retitles the release). Counting
          # from it therefore grows without bound, the >=THRESHOLD test is
          # satisfied forever, and the gate silently stops throttling —
          # it was measuring 147 commits from a 2026-09-15 base.
          BASE=""
          ASSETS=$(gh release view nightly --json assets -q '.assets[].name' 2>/dev/null || true)
          if [ -n "$ASSETS" ]; then
            # sort -r on the nightly-<date>-<sha> token puts the newest
            # nightly first when several datestamps are present.
            LAST_SHA=$(printf '%s\n' "$ASSETS" \
              | grep -oE 'nightly-[0-9]{8}-[0-9a-f]{7,40}' \
              | sort -r | head -n 1 \
              | sed -E 's/^nightly-[0-9]{8}-//')
            # Only trust it if that object is actually in our history.
            if [ -n "$LAST_SHA" ] && git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
              BASE="$LAST_SHA"
              echo "Last nightly built commit: $BASE"
            else
              echo "Nightly asset SHA unusable (got '${LAST_SHA:-none}') — falling back."
            fi
          else
            echo "Could not read nightly release assets — falling back."
          fi

          # Fallback: latest stable v* tag. Bounded by real releases, so it
          # still throttles even if asset lookup is unavailable.
          if [ -z "$BASE" ]; then
            BASE=$(git tag --sort=-v:refname --list 'v*.*.*' | head -n 1)
            if [ -z "$BASE" ]; then
              echo "No previous nightly and no v* tag — running (first nightly)."
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "commit_count=unknown" >> $GITHUB_OUTPUT
              echo "base=none" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Falling back to latest release tag: $BASE"
          fi

          COUNT=$(git rev-list --count "$BASE"..HEAD)
          echo "Commits since $BASE: $COUNT (threshold $THRESHOLD)"
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT

          if [ "$COUNT" -ge "$THRESHOLD" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Gate PASSED — proceeding with nightly."
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Gate SKIPPED — only $COUNT/$THRESHOLD new commits since $BASE."
          fi

  prep:
    name: Compute Nightly Suffix
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.stamp.outputs.suffix }}
      datestamp: ${{ steps.stamp.outputs.datestamp }}
      sha: ${{ steps.stamp.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: stamp
        run: |
          DATESTAMP=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          echo "datestamp=$DATESTAMP" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "suffix=-nightly-$DATESTAMP-$SHA" >> $GITHUB_OUTPUT
          echo "Nightly suffix: -nightly-$DATESTAMP-$SHA"

  verify:
    name: Verify (gate)
    needs: [prep]
    uses: ./.github/workflows/verify.yml

  build:
    name: Build Matrix
    needs: [prep, verify]
    uses: ./.github/workflows/build.yml
    with:
      asset_suffix: ${{ needs.prep.outputs.suffix }}
      publish_to_release: false
    secrets: inherit

