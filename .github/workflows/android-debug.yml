name: Android Debug

# TEMPORARY: reproduces the release lint step and re-emits the gradle log
# tail as annotations (job logs are unreachable from this environment).
# Deleted before this branch merges.

on:
  push:
    branches:
      - arena/593b0688-grablytic

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_skipNativePackages: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Lint (report tail as annotations)
        run: |
          set +e
          flutter build apk --release --config-only > "$RUNNER_TEMP/config.log" 2>&1
          cd android
          ./gradlew :app:lintRelease --console=plain > "$RUNNER_TEMP/lint.log" 2>&1
          status=$?
          echo "::error::gradle lintRelease exited $status"
          grep -n -i -E "error:|e: |FAILURE|What went wrong|Could not|Unresolved" "$RUNNER_TEMP/lint.log" | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -40 "$RUNNER_TEMP/lint.log" | while IFS= read -r line; do
            echo "::error::TAIL $line"
          done
          exit 0
