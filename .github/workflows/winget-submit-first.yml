name: Submit First WinGet Manifest

# One-shot bootstrap: winget-releaser only UPDATES existing packages.
# Verified approach (winget-create README + doc/submit.md + discussion #190):
# `wingetcreate new` is interactive by design and NOT for CI; `wingetcreate
# submit --prtitle --token <manifest-dir>` submits EXISTING local manifests
# non-interactively — exactly our case (hand-verified manifests in
# distribution/winget/). Token via WINGET_CREATE_GITHUB_TOKEN env (official
# CI guidance, avoids --token logging). Run once via workflow_dispatch, then
# delete this file after the PR merges (winget-releaser takes over updates).
# Requires secrets.WINGET_TOKEN (classic PAT, public_repo).

on:
  workflow_dispatch:

jobs:
  submit-first:
    name: Submit 0.0.1 manifests to winget-pkgs
    runs-on: windows-latest
    if: github.repository == 'OnlyXianzo/Grablytic'
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check WINGET_TOKEN present
        shell: bash
        run: '[ -n "$WINGET_CREATE_GITHUB_TOKEN" ] || { echo "::error::WINGET_TOKEN secret is not set"; exit 1; }'

      - name: Install wingetcreate
        run: winget install --id Microsoft.WingetCreate -e --accept-source-agreements --accept-package-agreements

      - name: Submit manifests
        shell: bash
        run: 'wingetcreate submit --prtitle "New package: OnlyXianzo.Grablytic version 0.0.1" --no-open "distribution/winget/manifests/o/OnlyXianzo/Grablytic/0.0.1"'
