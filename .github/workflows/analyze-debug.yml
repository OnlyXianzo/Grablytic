name: Analyze Debug

# TEMPORARY: mirrors the verify workflow's analyze + test steps but re-emits
# the failures as annotations (job logs are unreachable from this
# environment). Deleted before this branch merges.

on:
  push:
    branches:
      - arena/593b0688-grablytic

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          echo "::error::flutter analyze exited $?"
          head -c 2000 analyze.txt | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 0
      - name: Test
        run: |
          set +e
          flutter test > test.txt 2>&1
          echo "::error::flutter test exited $?"
          grep -A22 "\[E\]" test.txt | head -120 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          grep -n "Some tests failed\|tests passed" test.txt | tail -3 | while IFS= read -r line; do
            echo "::error::SUM $line"
          done
          exit 0
