name: Analyze Debug

# TEMPORARY: mirrors the verify workflow's analyze step but in GitHub
# annotation format, so the exact diagnostics are visible on the PR. Deleted
# before this branch merges.

on:
  push:
    branches:
      - arena/593b0688-grablytic

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (annotations)
        run: flutter analyze --format=github || true
