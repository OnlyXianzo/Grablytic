name: Analyze Debug

# TEMPORARY: mirrors the verify workflow's analyze step but re-emits every
# diagnostic as an error-level annotation, so the exact text is visible on
# the PR (job logs are not reachable from this environment). Deleted before
# this branch merges.

on:
  push:
    branches:
      - arena/593b0688-grablytic

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          echo "::error::flutter analyze exited $code"
          head -c 4000 analyze.txt | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 0
