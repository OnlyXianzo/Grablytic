name: Analyze Debug

# TEMPORARY: mirrors the verify workflow's analyze + test steps but reports
# through the JSON reporter and re-emits failures as annotations (job logs
# are unreachable from this environment). Deleted before this branch merges.

on:
  push:
    branches:
      - arena/593b0688-grablytic

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          echo "::error::flutter analyze exited $?"
          head -c 2000 analyze.txt | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 0
      - name: Test
        run: |
          set +e
          flutter test --reporter=json > test.json 2>&1
          echo "::error::flutter test exited $?"
          python3 - <<'PARSE' || true
          import json

          names = {}
          for raw in open("test.json", encoding="utf-8", errors="replace"):
              raw = raw.strip()
              if not raw.startswith("{"):
                  continue
              try:
                  event = json.loads(raw)
              except Exception:
                  continue
              kind = event.get("type")
              if kind == "testStart":
                  test = event.get("test", {})
                  names[test.get("id")] = test.get("name", "")
              elif kind == "testDone" and event.get("result") != "success" and not event.get("hidden"):
                  print("::error::FAILED " + str(names.get(event.get("testID"), "?")))
              elif kind == "error":
                  message = (event.get("error") or "").replace("\n", " | ")
                  print("::error::ERR " + message[:900])
          PARSE
          exit 0
