name: Publish Release Assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run ID containing artifacts'
        required: true
        default: '34767555115'
      tag_name:
        description: 'Release tag name'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write
  actions: read
  # Keyless (OIDC) cosign signing needs a GitHub ID token.
  id-token: write

jobs:
  publish:
    name: Upload Artifacts to Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts from run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloaded_artifacts
          gh run download "${{ github.event.inputs.run_id }}" --repo "${{ github.repository }}" --dir downloaded_artifacts
          echo "=== Downloaded Artifacts ==="
          find downloaded_artifacts -type f

      - name: Stage release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_assets
          # Find all release binary formats: APKs, debs, rpms, pkg.tar.zst, tar.gz, zip
          find downloaded_artifacts -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.tar.gz" -o -name "*.zip" \) | while read -r file; do
            # Exclude intermediate build bundles if already packaged as zip/tar.gz
            fname=$(basename "$file")
            echo "Staging asset: $fname from $file"
            cp "$file" "release_assets/$fname"
          done

          echo "=== Final Assets to Upload ==="
          ls -lh release_assets/

      # Keyless supply-chain signatures (BRUTAL-4 follow-up): each asset gets
      # a Sigstore bundle (Fulcio cert + Rekor transparency entry) bound to
      # this workflow's OIDC identity — no long-lived keys to rotate or leak.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'

      - name: Sign release assets (keyless OIDC)
        run: |
          for asset in release_assets/*; do
            [ -f "$asset" ] || continue
            echo "Signing: $asset"
            cosign sign-blob --yes --bundle "$asset.sigstore" "$asset"
          done
          echo "=== Signature bundles ==="
          ls -lh release_assets/*.sigstore

      - name: Verify signatures (fail closed)
        env:
          REPO: ${{ github.repository }}
        run: |
          for asset in release_assets/*; do
            case "$asset" in
              *.sigstore) continue ;;
            esac
            [ -f "$asset.sigstore" ] || { echo "MISSING bundle for $asset"; exit 1; }
            cosign verify-blob \
              --bundle "$asset.sigstore" \
              --certificate-identity-regexp "^https://github.com/$REPO/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$asset"
          done
          echo "All signatures verify against this repo's workflow identity."

      - name: Flatten and upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading assets to release ${{ github.event.inputs.tag_name }}..."
          gh release upload "${{ github.event.inputs.tag_name }}" release_assets/* --repo "${{ github.repository }}" --clobber
