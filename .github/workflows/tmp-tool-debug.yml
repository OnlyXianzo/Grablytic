name: TMP tool debug
on: push
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies & engine
        run: uv pip install --system yt-dlp pytest pytest-cov -e engine/
      - name: Which pytest
        run: |
          which pytest; pytest --version; python3 -c "import pytest,cov; print(pytest.__version__)"
      - name: Run tool tests
        run: |
          set +e
          pytest tool/tests -q > /tmp/out.txt 2>&1
          code=$?
          echo "exit=$code"
          cat /tmp/out.txt
          while IFS= read -r line; do echo "::warning::$line"; done < <(tail -n 25 /tmp/out.txt)
          exit 0
