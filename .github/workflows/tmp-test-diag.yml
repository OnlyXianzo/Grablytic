name: TMP test diagnostics

# TEMPORARY: this workspace cannot download CI logs, only check-run
# annotations. This re-emits failing `flutter test` results as annotations so
# the failing test name and message are readable. Delete before merge.

on:
  push:
    branches: [arena/a13536ac-grablytic]

jobs:
  test:
    name: Flutter test (annotated)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: targeted test run (annotated)
        shell: bash
        run: |
          set +e
          flutter test test/features/home/playlist_selection_screen_test.dart \
            test/features/library/download_history_screen_test.dart \
            > /tmp/t.txt 2>&1
          echo "exit=$?"
          python3 - <<'PY'
          lines = open('/tmp/t.txt', errors='replace').read().splitlines()
          blocks = 0
          for i, line in enumerate(lines):
              if any(k in line for k in ('EXCEPTION CAUGHT', 'The following', 'Failed assertion', 'overflowed', 'Error: ')):
                  chunk = ' || '.join(l.strip() for l in lines[i:i + 5] if l.strip())
                  chunk = chunk.replace('%', 'pct')[:800]
                  print(f'::error::{chunk}')
                  blocks += 1
                  if blocks >= 12:
                      break
          print(f'::notice::blocks emitted: {blocks}, lines: {len(lines)}')
          PY
          exit 0
