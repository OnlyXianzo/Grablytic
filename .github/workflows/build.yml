name: Build and Release

on:
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure python3.11 on PATH
        run: |
          which python3.11 || sudo ln -sf "$(which python3)" /usr/local/bin/python3.11
          python3.11 --version

      - name: Install CMake 3.31.4
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.4"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "storePassword=${{ env.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ env.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ env.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - run: flutter pub get

      - name: Stamp Flutter version
        run: echo "TRUESTREAM_FLUTTER_VERSION=$(flutter --version | head -n 1)" >> $GITHUB_ENV

      - name: Build APKs (Split per ABI)
        run: flutter build apk --release --split-per-abi --dart-define=TRUESTREAM_FLUTTER_VERSION="${{ env.TRUESTREAM_FLUTTER_VERSION }}"

      - name: Upload arm64-v8a APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: truestream-android-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload x86_64 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: truestream-android-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk

  windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Stamp Flutter version
        run: echo "TRUESTREAM_FLUTTER_VERSION=$(flutter --version | head -n 1)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows App
        run: flutter build windows --release --dart-define="TRUESTREAM_FLUTTER_VERSION=${{ env.TRUESTREAM_FLUTTER_VERSION }}"

      - name: Copy Python Engine to Bundle
        run: xcopy /E /I engine\truestream_engine build\windows\x64\runner\Release\truestream_engine

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: truestream-windows-app
          path: build/windows/x64/runner/Release/

  linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Stamp Flutter version
        run: echo "TRUESTREAM_FLUTTER_VERSION=$(flutter --version | head -n 1)" >> $GITHUB_ENV

      - name: Build Linux App
        run: flutter build linux --release --dart-define="TRUESTREAM_FLUTTER_VERSION=${{ env.TRUESTREAM_FLUTTER_VERSION }}"

      - name: Copy Python Engine to Bundle
        run: cp -r engine/truestream_engine build/linux/x64/release/bundle/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: truestream-linux-app
          path: build/linux/x64/release/bundle/
