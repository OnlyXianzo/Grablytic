# CI Log Digest — turn a *finished* job's log into check-run annotations.
#
# Why this exists: a red job only exposes "Process completed with exit code 1"
# through the checks API, and the raw log lives on a signed blob-storage URL
# that is not always reachable from a review environment, an agent sandbox or
# a phone. The failing detail — which test, which assertion, which coverage
# number — is exactly what a reviewer needs, so this workflow fetches the log
# from inside Actions (where blob storage *is* reachable) and re-emits the
# interesting lines as `::error::` annotations, which
# `/repos/{owner}/{repo}/actions/jobs/{id}/annotations` answers without any
# extra access.
#
# Two ways in, both read-only:
#   * comment `/ci-digest <job-id>` on a pull request (a slash command, so
#     reviewers can pull the cause of a red run into the thread they are
#     already reading), or
#   * Actions → "CI Log Digest" → Run workflow, with `job_id`.
#
# Find the job id with:
#   gh run view <run-id> --json jobs -q '.jobs[] | [.name,.databaseId] | @tsv'
# Read the digest back with:
#   gh api repos/<owner>/<repo>/actions/jobs/<job-id>/annotations
#
# Permissions stay at actions: read + contents: read. Only the repository's
# own job logs are read, and a slash command from a non-collaborator is
# ignored, so this cannot be pointed at another repository or used to pull
# private data into a thread.

name: CI Log Digest

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Actions job databaseId whose log should be digested.'
        required: true
        type: string
      context_lines:
        description: 'Log lines of context kept around each failure marker.'
        required: false
        default: '2'
        type: string
  issue_comment:
    types: [created]
  # Escape hatch: some tokens (and every GitHub App install without
  # `actions: write`) cannot create workflow_dispatch events. A push whose
  # head commit message contains the command runs the same digest, so the
  # tool stays usable from a plain `git push`.
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  digest:
    name: Digest job log
    # PR comments only, only the documented command, only from someone with
    # write access, and only on a PR (never a plain issue).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/ci-digest') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association)) ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '/ci-digest'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the job id
        id: resolve
        env:
          COMMENT: ${{ github.event.comment.body }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_JOB_ID: ${{ inputs.job_id }}
          INPUT_CONTEXT: ${{ inputs.context_lines }}
        run: |
          set -euo pipefail
          JOB_ID="${INPUT_JOB_ID:-}"
          if [ -z "$JOB_ID" ]; then
            # `/ci-digest 118508979807` — first number after the command.
            SOURCE=$(printf '%s\n%s\n' "$COMMENT" "$PUSH_MESSAGE")
            JOB_ID=$(printf '%s\n' "$SOURCE" \
              | grep -oE '/ci-digest[[:space:]]+[0-9]+' \
              | grep -oE '[0-9]+$' | head -n 1 || true)
          fi
          case "$JOB_ID" in
            ''|*[!0-9]*)
              echo "::error::No job id found. Use '/ci-digest <job-id>' or the workflow_dispatch 'job_id' input."
              exit 1
              ;;
          esac
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "context=${INPUT_CONTEXT:-2}" >> "$GITHUB_OUTPUT"
          echo "Digesting job $JOB_ID"

      - name: Fetch job log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.resolve.outputs.job_id }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/job.log"

          # `gh api` follows GitHub's 302 to signed blob storage. Capture the
          # failure instead of dying silently: an unreachable log is the one
          # thing this workflow exists to report on.
          # `--allow-escape-sequences`: Actions logs carry ANSI colour codes,
          # which `gh api` refuses to write to a non-tty by default.
          if gh api --allow-escape-sequences "repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" > "$LOG" 2>"$RUNNER_TEMP/gh.err"; then
            echo "Fetched $(wc -l < "$LOG") log lines via gh api."
          else
            echo "::warning::gh api failed: $(head -c 400 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')"
            # Fallback: raw REST call, no gh in the path.
            CODE=$(curl -sSL -o "$LOG" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${JOB_ID}/logs" || true)
            echo "curl fallback: HTTP $CODE, $(wc -l < "$LOG" 2>/dev/null || echo 0) lines."
            if [ "$CODE" != "200" ]; then
              echo "::error::Could not fetch the log for job ${JOB_ID} (gh api failed, curl got HTTP ${CODE}). Body: $(head -c 400 "$LOG" | tr '\n' ' ')"
              exit 1
            fi
          fi

          if [ ! -s "$LOG" ]; then
            echo "::error::The log for job ${JOB_ID} came back empty."
            exit 1
          fi
          # The tail is the part that names the failure; keep it in the log.
          tail -n 40 "$LOG"

      - name: Emit the failure summary as annotations
        env:
          CONTEXT_LINES: ${{ steps.resolve.outputs.context }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/job.log" "$CONTEXT_LINES" <<'PY'
          import re
          import sys

          path, ctx_raw = sys.argv[1], sys.argv[2]
          try:
              ctx = max(0, min(10, int(ctx_raw)))
          except ValueError:
              ctx = 2

          # Actions logs are ANSI-coloured and timestamped; both are noise here.
          STAMP = re.compile(r"^\d{4}-\d{2}-\d{2}T[\d:.]+Z ?")
          ANSI = re.compile(r"\x1b\[[0-9;?]*[ -/]*[@-~]")
          STEP_ERROR = re.compile(r"^##\[error\]")
          STEP_BOUNDARY = re.compile(r"^##\[(group|endgroup)\]")

          lines = []
          with open(path, encoding="utf-8", errors="replace") as handle:
              for raw in handle:
                  lines.append(STAMP.sub("", ANSI.sub("", raw.rstrip("\n"))))

          def emit(chunk):
              """One annotation per chunk; '%' must be escaped for the runner."""
              body = " | ".join(chunk)[:900]
              body = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error::{body}")

          # 1. Best signal: the block that precedes the step's own error marker.
          #    The end of a job log is post-job git/checkout cleanup, never the
          #    failure, so the marker is what anchors the report.
          last_error = None
          for index, line in enumerate(lines):
              if STEP_ERROR.match(line):
                  last_error = index
          if last_error is not None:
              start = max(0, last_error - 60)
              for index in range(last_error, start - 1, -1):
                  if STEP_BOUNDARY.match(lines[index]):
                      start = index
                      break
              block = [
                  l.strip() for l in lines[start:last_error + 1]
                  if l.strip() and not STEP_BOUNDARY.match(l)
              ]
              print(f"::group::Failure block ({len(block)} lines before the step error)")
              for offset in range(0, min(len(block), 60), 6):
                  emit(block[offset:offset + 6])
              print("::endgroup::")
              raise SystemExit(0)

          # 2. No step marker (a cancelled or timed-out step): pytest-shaped markers.
          markers = [
              re.compile(r"^FAILED "),                       # pytest short summary
              re.compile(r"^ERROR "),                        # collection/runtime error
              re.compile(r"^E\s+\S"),                        # pytest assertion detail
              re.compile(r"Required test coverage of"),      # pytest-cov gate
              re.compile(r"^\s*assert\s"),
              re.compile(r"^(Traceback \(most recent call last\)|.*Error:)"),
              re.compile(r"^\d+ (failed|passed|error)"),     # pytest tail summary
              re.compile(r"=+ .*(failed|passed|error).* =+"),
          ]
          hits, seen = [], set()
          for index, line in enumerate(lines):
              if not line.strip() or not any(m.search(line) for m in markers):
                  continue
              block = tuple(range(max(0, index - ctx), min(len(lines), index + ctx + 1)))
              if block in seen:
                  continue
              seen.add(block)
              hits.append(block)
          if hits:
              print(f"::group::Extracted {len(hits)} failure block(s)")
              for block in hits[:10]:
                  emit([lines[i].strip() for i in block if lines[i].strip()])
              print("::endgroup::")
              raise SystemExit(0)

          # 3. Last resort: say so, and show what the log ends with.
          tail = [l for l in lines if l.strip()][-15:]
          print("::error::No step marker and no failure marker matched; last 15 lines follow.")
          for line in tail:
              print("::error::tail " + line.strip()[:900])
          PY

      - name: Coverage + summary tail
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/job.log" <<'PY'
          import re
          import sys

          STAMP = re.compile(r"^\d{4}-\d{2}-\d{2}T[\d:.]+Z ?")
          ANSI = re.compile(r"\x1b\[[0-9;?]*[ -/]*[@-~]")
          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              lines = [STAMP.sub("", ANSI.sub("", l.rstrip("\n"))) for l in handle]

          # The per-step markers Actions writes name the step that ran; report
          # the last one so the annotation is tied to the right step.
          steps = [l for l in lines if "##[group]" in l]
          interesting = [
              l for l in lines
              if re.search(r"(Required test coverage|TOTAL\s+\d+|tests? (passed|failed|error)|FAIL Required)", l)
          ]
          for line in interesting[-6:]:
              print(f"::notice::{line.strip()[:900]}")
          if steps:
              print(f"::notice::last step marker: {steps[-1].strip()[:300]}")
          PY
