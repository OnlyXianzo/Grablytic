# Verification matrix — every push/PR to main.
#
# Layers (each fails the run independently):
#   flutter_verify  analyze (fatal) + unit/widget tests + coverage artifact
#   python_verify   pytest + coverage ratchet (>=70%) + ruff correctness gate
#   docs_links      relative Markdown links resolve (allowlist documented)
#   secrets_scan    gitleaks (no committed credentials)
#
# Deliberately NOT gated (documented, revisit quarterly):
#   - dart format: 55 files predate formatting; normalizing mid-flight
#     would churn every concurrent branch. Enforce after one cleanup PR.
#   - flutter coverage floor: 24% today (widget tests are young); ratcheting
#     a low number enshrines it. Artifact uploaded for visibility instead.
#   - ruff style rules (BLE/SIM/etc.): the engine uses defensive
#     try/except-by-design; only correctness rules (F, minus F401 import
#     audit backlog) are gated.

name: Verification

on:
  # T4-5: every branch + every PR, not just main. Feature branches must
  # prove green before merge, not after.
  push:
  pull_request:
  workflow_call:

# One run per ref: a new push supersedes the previous run on that branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter_verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run widget & unit tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  python_verify:
    name: Python Engine Tests (3.11 / 3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies & engine
        run: uv pip install --system yt-dlp pytest pytest-cov -e engine/

      - name: Run engine tests with coverage ratchet
        run: pytest engine/tests/ -q --cov=engine/grablytic_engine --cov-report=term --cov-fail-under=75

      # astral-sh/ruff-action (pinned): prebuilt binary, no pip build.
      # Gate unchanged: correctness rules (F, minus F401 import audit
      # backlog). New releases add rules, so the pin is load-bearing.
      - name: Ruff correctness gate
        uses: astral-sh/ruff-action@v4
        with:
          version: "0.16.7"
          src: "engine/"
          args: "check --select F --ignore F401 --output-format=github"

  docs_links:
    name: Docs Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check relative Markdown links resolve
        run: python3 tool/check_doc_links.py

  secrets_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow_lint:
    name: Workflow YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every workflow as YAML + check required keys
        run: |
          python3 - <<'EOF'
          import sys
          import yaml
          from pathlib import Path
          failed = False
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              try:
                  doc = yaml.safe_load(path.read_text())
              except yaml.YAMLError as e:
                  print(f"::error file={path}::YAML parse error: {e}")
                  failed = True
                  continue
              # NOTE: YAML 1.1 parses the `on:` key as boolean True.
              on = doc.get("on", doc.get(True))
              if not isinstance(doc, dict) or on is None or "jobs" not in doc:
                  print(f"::error file={path}::missing top-level 'on'/'jobs' keys")
                  failed = True
                  continue
              print(f"OK: {path} ({len(doc['jobs'])} jobs)")
          sys.exit(1 if failed else 0)
          EOF
