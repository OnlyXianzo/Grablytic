# Verification matrix — every push/PR and reusable workflow call.
#
# Layers (each fails the run independently):
#   flutter_verify      analyze + unit/widget tests + project-lib LCOV floor
#   android_ipc_smoke   API 35 emulator: Flutter MethodChannel → Chaquopy → Python
#   python_verify       pytest + 75% coverage ratchet + ruff correctness gate
#   docs_links          relative Markdown links resolve
#   secrets_scan        gitleaks (no committed credentials)
#   workflow_lint       parse every workflow and require triggers/jobs
#
# Coverage exclusions are intentionally narrow: `.coveragerc` omits only
# typing-only blocks and optional Python script entrypoints; the Dart checker
# measures unique executable lines under `lib/` and ignores SDK/test files.
# Flutter's floor is ratcheted at 30% (higher than the previous 24% baseline).
# Dart formatting remains a separate cleanup because of repository-wide legacy
# churn; Ruff style rules outside correctness remain intentionally ungated.
# The Ruff gate covers the whole correctness rule set, unused imports (F401)
# included.

name: Verification

on:
  # T4-5: every branch + every PR, not just main. Feature branches must
  # prove green before merge, not after.
  push:
  pull_request:
  workflow_call:

# One run per ref: a new push supersedes the previous run on that branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter_verify:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run widget & unit tests with coverage
        run: flutter test --coverage

      - name: Enforce Flutter project-lib coverage floor
        run: python3 tool/check_flutter_coverage.py coverage/lcov.info --fail-under 30

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  android_ipc_smoke:
    name: Android API 35 — Flutter → Chaquopy → Python IPC
    runs-on: ubuntu-latest
    env:
      # The bridge smoke needs a compileable APK but does not exercise bundled
      # package extraction; release/package CI remains responsible for assets.
      ORG_GRADLE_PROJECT_skipNativePackages: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Hosted runners may expose /dev/kvm only to the kvm group. Without access,
      # the emulator silently falls back to slow software CPU emulation.
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # Lint on the release variant. `lint { abortOnError = true }` in
      # android/app/build.gradle.kts used to be disabled, so nothing
      # checked a release build before it shipped.
      #
      # `flutter pub get` writes the plugin registrant with the dev-only
      # plugins (integration_test) that the release variant does not
      # link, so the release Java compile fails before lint even starts.
      # A release-mode `flutter build --config-only` rewrites the
      # registrant without them and injects the Gradle wrapper into
      # android/ (it is git-ignored), without running a single Gradle
      # task, so this stays a lint-only step.
      - name: Android lint (release variant)
        run: |
          flutter build apk --release --config-only
          cd android
          ./gradlew :app:lintRelease --console=plain

      - name: Run end-to-end Android integration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          disable-linux-hw-accel: false
          # The host driver runs this device test without the unused DDS service.
          script: >-
            flutter drive --no-dds
            --driver=test_driver/integration_test.dart
            --target=integration_test/android_engine_ipc_test.dart
            -d emulator-5554

  python_verify:
    name: Python Engine Tests (3.11 / 3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies & engine
        run: uv pip install --system yt-dlp pytest pytest-cov -e engine/

      - name: Run engine tests with coverage ratchet
        run: pytest engine/tests/ -q --cov=engine/grablytic_engine --cov-report=term --cov-fail-under=75

      # astral-sh/ruff-action, pinned to immutable commit SHA (upstream
      # carries no `v4` moving tag — `.../ruff-action@v4` fails to resolve).
      # Gate: the full correctness rule set (F), including F401
      # (unused imports). F401 was disabled behind an "import audit
      # backlog" that has since been worked off — the engine and its
      # tests are clean, so the exclusion is gone. The ruff VERSION pin
      # is load-bearing (new releases add rules); the ACTION pin is
      # supply-chain hygiene.
      - name: Ruff correctness gate
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.7"
          src: "engine/"
          args: "check --select F --output-format=github"

  docs_links:
    name: Docs Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check relative Markdown links resolve
        run: python3 tool/check_doc_links.py

  secrets_scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow_lint:
    name: Workflow YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Parse every workflow as YAML + check required keys
        run: |
          python3 - <<'EOF'
          import sys
          import yaml
          from pathlib import Path
          failed = False
          for path in sorted(Path(".github/workflows").glob("*.yml")):
              try:
                  doc = yaml.safe_load(path.read_text())
              except yaml.YAMLError as e:
                  print(f"::error file={path}::YAML parse error: {e}")
                  failed = True
                  continue
              if not isinstance(doc, dict):
                  print(f"::error file={path}::workflow document must be a mapping")
                  failed = True
                  continue
              # NOTE: YAML 1.1 parses the `on:` key as boolean True.
              on = doc.get("on", doc.get(True))
              if on is None or "jobs" not in doc:
                  print(f"::error file={path}::missing top-level 'on'/'jobs' keys")
                  failed = True
                  continue
              print(f"OK: {path} ({len(doc['jobs'])} jobs)")
          sys.exit(1 if failed else 0)
          EOF
