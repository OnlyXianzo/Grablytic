name: Publish to WinGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version tag to submit (e.g. v0.0.2). Required for manual runs: releases created by GITHUB_TOKEN do not fire the release trigger.'
        required: false
        default: ''

jobs:
  winget:
    name: Submit WinGet Manifest
    runs-on: windows-latest
    # Fork-safe: only run upstream (forks lack WINGET_TOKEN; the check step below fails fast there).
    if: github.repository == 'OnlyXianzo/Grablytic'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check WINGET_TOKEN present
        shell: bash
        run: '[ -n "$WINGET_TOKEN" ] || { echo "::error::WINGET_TOKEN secret is not set — add a classic PAT (public_repo) as repo secret"; exit 1; }'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      - name: Submit package to Windows Package Manager Community Repository
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: OnlyXianzo.Grablytic
          version: ${{ inputs.version || github.event.release.tag_name || '0.0.2' }}
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
