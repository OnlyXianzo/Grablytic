name: Temp Debug
on:
  workflow_dispatch:
  push:
    branches: [arena/9efb08d1-grablytic]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze > /tmp/analyze.txt 2>&1 && exit 0
          head -c 6000 /tmp/analyze.txt | tr '\n' '\r' | sed 's/\r/\\n/g' | sed 's/%/%25/g' | fold -w 900 | while read -r chunk; do
            echo "::error::${chunk}"
          done
          exit 1
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            /tmp/analyze.txt
            /tmp/test.txt
      - name: Test
        if: always()
        run: |
          set -o pipefail
          flutter test > /tmp/test.txt 2>&1 && exit 0
          grep -n -E "^[0-9]{2}:[0-9]{2} |\[E\]|Expected:|Actual:|Which:|test/.*dart" /tmp/test.txt | tail -80 | sed 's/%/%25/g' | while read -r line; do
            echo "::error::${line}"
          done
          exit 1
