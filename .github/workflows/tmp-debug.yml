name: Temp Debug
on:
  workflow_dispatch:
  push:
    branches: [arena/9efb08d1-grablytic]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze > /tmp/analyze.txt 2>&1 && echo "::notice::analyze clean" && exit 0
          head -30 /tmp/analyze.txt | cut -c1-300 | sed 's/%/%25/g' | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1
      - name: Test
        if: always()
        run: |
          flutter test --reporter json > /tmp/t.json 2>/tmp/t.err || true
          cat > /tmp/parse.py <<'PYEOF'
          import json
          import sys
          fails = []
          names = {}
          for line in open('/tmp/t.json', encoding='utf-8', errors='replace'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  ev = json.loads(line)
              except ValueError:
                  continue
              if ev.get('type') == 'testStart':
                  names[ev['test']['id']] = ev['test']['name']
              elif ev.get('type') == 'error':
                  fails.append((names.get(ev.get('testID'), '?'), str(ev.get('error', '')) + ' || ' + str(ev.get('stackTrace', ''))[:700]))
          if not fails:
              print('::error::no failures parsed from the json reporter')
              sys.exit(0)
          for name, err in fails[:8]:
              msg = ' '.join(str(err).split())[:700].replace('%', '%25')
              title = ' '.join(str(name).split())[:120]
              print('::error::FAILED ' + title + ' :: ' + msg)
          sys.exit(1)
          PYEOF
          python3 /tmp/parse.py
