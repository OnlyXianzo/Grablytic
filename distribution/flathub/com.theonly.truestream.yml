app-id: com.theonly.truestream
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: truestream

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-download
  - --device=dri

modules:
  - name: truestream
    buildsystem: simple
    build-commands:
      - install -Dm755 truestream /app/bin/truestream
      - cp -r lib/ /app/lib/
      - cp -r data/ /app/data/
      - install -Dm644 com.theonly.truestream.desktop /app/share/applications/com.theonly.truestream.desktop
      - install -Dm644 truestream.png /app/share/icons/hicolor/512x512/apps/com.theonly.truestream.png
      - install -Dm644 com.theonly.truestream.metainfo.xml /app/share/metainfo/com.theonly.truestream.metainfo.xml
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/OnlyXianzo/TrueStream/releases/download/v0.0.1/truestream-0.0.1-linux-x64.tar.gz
        sha256: ddba14063d1bb7d0d7c3e7d1f73fe2c4174cbec1f7528ef353b1f84a626f1450
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/OnlyXianzo/TrueStream/releases/download/v0.0.1/truestream-0.0.1-linux-arm64.tar.gz
        sha256: 0f39d9eeef6b5ac851612c43b8dbbae20f748b4e6a17541e28033f66a4a0a6d0
      - type: file
        path: com.theonly.truestream.desktop
      - type: file
        path: truestream.png
      - type: file
        path: com.theonly.truestream.metainfo.xml
